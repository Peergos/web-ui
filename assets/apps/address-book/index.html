<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Address Book</title>
<link rel="stylesheet" href="address-book.css">
</head>
<body>
<div id="app">
	<aside id="books">
		<div class="pane-head"><h2>Address books</h2></div>
		<ul class="scroll" id="bookList"></ul>
		<div class="foot"><button onclick="newBook()">+ New address book</button></div>
	</aside>
	<section id="list">
		<div class="pane-head">
			<h2 id="bookTitle"></h2>
			<select id="bookSelect" onchange="onBookSelect(this.value)"></select>
			<button class="link" title="Rename address book" onclick="renameBook()">Rename</button>
			<button class="link" id="deleteBookButton" title="Delete address book" onclick="deleteBook()">Delete</button>
		</div>
		<div class="pane-head">
			<button class="primary" onclick="newContact()">+ New contact</button>
			<button onclick="document.getElementById('importFile').click()">Import .vcf</button>
			<input type="file" id="importFile" accept=".vcf,text/vcard" multiple style="display:none" onchange="importFiles(this)">
		</div>
		<div class="search"><input id="search" type="search" placeholder="Search" oninput="renderContacts()"></div>
		<ul class="scroll" id="contacts"></ul>
	</section>
	<main id="detail"></main>
</div>
<div id="status"></div>
<script src="address-book.js"></script>
</body>
</html>
